let items = JSON.parse(localStorage.getItem('peonia_items') || '[]');
let budget = localStorage.getItem('peonia_budget') || '';
let darkMode = localStorage.getItem('peonia_dark') === 'true';
let hideChecked = false;

const themeToggle = document.getElementById('themeToggle');
const budgetInput = document.getElementById('budgetInput');

if (darkMode) {
document.body.classList.add('dark');
themeToggle.textContent = '☀️';
}
budgetInput.value = budget;

themeToggle.addEventListener('click', () => {
darkMode = !darkMode;
document.body.classList.toggle('dark', darkMode);
themeToggle.textContent = darkMode ? '☀️' : '🌙';
localStorage.setItem('peonia_dark', darkMode);
vibrate();
});

budgetInput.addEventListener('input', (e) => {
budget = e.target.value;
localStorage.setItem('peonia_budget', budget);
updateTotals();
});

function vibrate() {
if (navigator.vibrate) navigator.vibrate(25);
}

function save() {
localStorage.setItem('peonia_items', JSON.stringify(items));
render();
}

function addItem() {
const nameEl = document.getElementById('itemName');
const qtyEl = document.getElementById('itemQty');
const priceEl = document.getElementById('itemPrice');
const catEl = document.getElementById('itemCategory');

const name = nameEl.value.trim();
if (!name) return;

const qty = Math.max(1, parseInt(qtyEl.value) || 1);
const price = Math.max(0, parseFloat(priceEl.value) || 0);

items.push({
id: Date.now(),
name,
qty,
price,
category: catEl.value,
checked: false
});

nameEl.value = '';
qtyEl.value = '1';
priceEl.value = '';
vibrate();
save();
}

function quickAdd(name, category) {
items.push({
id: Date.now() + Math.random(),
name,
qty: 1,
price: 0,
category,
checked: false
});
vibrate();
save();
}

function changeQty(id, delta) {
items = items.map(item => {
if (item.id === id) {
const next = Math.max(1, item.qty + delta);
return { ...item, qty: next };
}
return item;
});
vibrate();
save();
}

function editPrice(id) {
const item = items.find(i => i.id === id);
if (!item) return;
const newPrice = prompt(Τιμή μονάδας (€) για "${item.name}":, item.price || '');
if (newPrice !== null) {
const parsed = parseFloat(newPrice.replace(',', '.'));
if (!isNaN(parsed) && parsed >= 0) {
item.price = parsed;
vibrate();
save();
}
}
}

function toggleItem(id) {
items = items.map(item => item.id === id ? { ...item, checked: !item.checked } : item);
vibrate();
save();
}

function toggleHideChecked() {
hideChecked = !hideChecked;
document.getElementById('hideCheckedBtn').classList.toggle('active', hideChecked);
vibrate();
render();
}

function deleteItem(id) {
items = items.filter(item => item.id !== id);
vibrate();
save();
}

function clearChecked() {
items = items.filter(item => !item.checked);
vibrate();
save();
}

function clearAll() {
if (confirm('Θέλεις σίγουρα να σβήσεις όλα τα προϊόντα από τη λίστα;')) {
items = [];
vibrate();
save();
}
}

function supportApp(e) {
e.preventDefault();
alert('Ευχαριστούμε πολύ για την υποστήριξη! Εδώ μπορείς να συνδέσεις τον δικό σου σύνδεσμο Buy Me a Coffee, Revolut ή PayPal.');
}

function shareList() {
if (items.length === 0) return;
let text = "🛒 Λίστα Σούπερ Μάρκετ:\n\n";
items.forEach(i => {
const mark = i.checked ? "✅" : "⬜";
const priceStr = i.price > 0 ? (${(i.qty * i.price).toFixed(2)}€) : "";
text += ${mark} ${i.name} x${i.qty}${priceStr}\n;
});
const total = items.reduce((sum, i) => sum + i.qty * i.price, 0);
text += \n💰 Σύνολο: ${total.toFixed(2)} €;

if (navigator.share) {
navigator.share({ title: 'Λίστα Σούπερ Μάρκετ', text });
} else {
navigator.clipboard.writeText(text);
alert('Η λίστα αντιγράφηκε! Μπορείς να την κάνεις επικόλληση στο Viber/WhatsApp.');
}
}

function updateTotals() {
const total = items.reduce((sum, i) => sum + (i.qty * i.price), 0);
document.getElementById('totalAmount').textContent = ${total.toFixed(2)} €;

const summaryBar = document.getElementById('summaryBar');
const budgetStatus = document.getElementById('budgetStatus');
const bVal = parseFloat(budget);

if (bVal > 0) {
const diff = bVal - total;
if (diff < 0) {
summaryBar.classList.add('over-budget');
budgetStatus.textContent = Υπέρβαση κατά ${Math.abs(diff).toFixed(2)} €!;
} else {
summaryBar.classList.remove('over-budget');
budgetStatus.textContent = Υπόλοιπο: ${diff.toFixed(2)} €;
}
} else {
summaryBar.classList.remove('over-budget');
budgetStatus.textContent = 'Χωρίς όριο';
}
}

function render() {
const container = document.getElementById('listContainer');
const actionsRow = document.getElementById('actionsRow');
const filterBar = document.getElementById('filterBar');
const progressFill = document.getElementById('progressFill');
const doneBanner = document.getElementById('doneBanner');
const query = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();

const checkedCount = items.filter(i => i.checked).length;
document.getElementById('progressText').textContent = Αγοράστηκαν ${checkedCount} / ${items.length};
const pct = items.length ? (checkedCount / items.length) * 100 : 0;
progressFill.style.width = ${pct}%;

if (items.length > 0 && checkedCount === items.length) {
progressFill.classList.add('done');
doneBanner.style.display = 'block';
} else {
progressFill.classList.remove('done');
doneBanner.style.display = 'none';
}

updateTotals();

if (items.length === 0) {
container.innerHTML = <div class="empty-state">Η λίστα σου είναι άδεια.<br>Πρόσθεσε προϊόντα από πάνω ή επίλεξε από τη Γρήγορη Προσθήκη!</div>;
actionsRow.style.display = 'none';
filterBar.style.display = 'none';
return;
}

actionsRow.style.display = 'grid';
filterBar.style.display = 'flex';

let filtered = items;
if (hideChecked) filtered = filtered.filter(i => !i.checked);
if (query) filtered = filtered.filter(i => i.name.toLowerCase().includes(query));

const grouped = {};
filtered.forEach(item => {
if (!grouped[item.category]) grouped[item.category] = [];
grouped[item.category].push(item);
});

let html = '';
for (const [cat, catItems] of Object.entries(grouped)) {
html += <div class="category-block"><div class="category-title">${cat}</div>;
catItems.forEach(item => {
const subtotal = (item.qty * item.price).toFixed(2);
const priceLabel = item.price > 0 ? ${subtotal} € : + Τιμή;
html += <div class="item-card ${item.checked ? 'checked' : ''}"> <div class="item-left" onclick="toggleItem(${item.id})"> <div class="checkbox">${item.checked ? '✓' : ''}</div> <div class="item-info"> <div class="item-name">${item.name}</div> ${item.price > 0 ?${item.price.toFixed(2)}€ / τεμ.: ''} </div> </div> <div class="item-right"> <div class="qty-controls"> <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button> <span class="qty-val">${item.qty}</span> <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button> </div> <button class="item-price-btn" onclick="editPrice(${item.id})" title="Αλλαγή τιμής">${priceLabel}</button> <button class="del-btn" onclick="deleteItem(${item.id})" title="Διαγραφή">✕</button> </div> </div>;
});
html += </div>;
}
container.innerHTML = html || <div class="empty-state">Δεν βρέθηκαν προϊόντα με αυτό το φίλτρο.</div>;
}

document.getElementById('itemName').addEventListener('keypress', (e) => {
if (e.key === 'Enter') addItem();
});

render();</script> </body> </html>
