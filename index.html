  <style>
    :root {
      --bg-color: #FAF6F0;
      --surface-color: #FFFFFF;
      --surface-alt: #F3ECE1;
      --text-main: #2D2A26;
      --text-muted: #7A736B;
      --accent: #C85A32;
      --accent-hover: #B04A25;
      --sage: #6B705C;
      --sage-light: #E8EBE2;
      --success: #3E8E41;
      --danger: #D9381E;
      --border-color: #E6DDD0;
      --shadow: 0 4px 12px rgba(45, 42, 38, 0.06);
      --radius: 14px;
    }

    body.dark {
      --bg-color: #1C1917;
      --surface-color: #262320;
      --surface-alt: #322E2A;
      --text-main: #F5EFE6;
      --text-muted: #A89F94;
      --accent: #D96B43;
      --accent-hover: #E57A53;
      --sage: #8A9178;
      --sage-light: #2F3329;
      --success: #4CAF50;
      --danger: #EF5350;
      --border-color: #3D3833;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.4;
      padding-bottom: 145px;
      transition: background-color 0.3s ease, color 0.3s ease;
      overflow-x: hidden;
    }

    /* Falling Autumn Leaves */
    .leaves-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .leaf {
      position: absolute;
      top: -40px;
      font-size: 1.2rem;
      opacity: 0.35;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(-40px) rotate(0deg) translateX(0px);
      }
      50% {
        transform: translateY(50vh) rotate(180deg) translateX(20px);
      }
      100% {
        transform: translateY(105vh) rotate(360deg) translateX(-15px);
      }
    }

    /* Main Container */
    .app-container {
      position: relative;
      z-index: 1;
      max-width: 540px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-cart {
      font-size: 2rem;
      display: inline-block;
      animation: floatCart 3s ease-in-out infinite;
    }

    @keyframes floatCart {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(-4deg); }
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.3px;
    }

    .theme-btn {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease;
    }

    /* Press effect on all buttons */
    button:active {
      transform: scale(0.94);
    }

    /* Progress Bar Card */
    .card {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .progress-track {
      width: 100%;
      height: 12px;
      background: var(--surface-alt);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #E07A5F);
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1), background 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .progress-fill.completed {
      background: linear-gradient(90deg, var(--success), #66BB6A);
    }

    /* Shimmer effect */
    .progress-fill::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.45) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      animation: shimmer 2.2s infinite;
    }

    @keyframes shimmer {
      100% { left: 160%; }
    }

    .reward-msg {
      display: none;
      margin-top: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--success);
      text-align: center;
      animation: popIn 0.3s ease;
    }

    .reward-msg.show {
      display: block;
    }

    /* Quick Add Horizontal Bar */
    .quick-add-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }

    .quick-add-scroll::-webkit-scrollbar {
      display: none;
    }

    .quick-chip {
      flex: 0 0 auto;
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      transition: background 0.2s, border-color 0.2s;
    }

    .quick-chip:hover {
      border-color: var(--accent);
    }

    /* Add Item Form */
    .add-form {
      display: grid;
      grid-template-columns: 1fr 76px 84px;
      gap: 8px;
    }

    .add-form input,
    .add-form select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--surface-alt);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .add-form input:focus,
    .add-form select:focus {
      border-color: var(--accent);
    }

    .form-bottom-row {
      grid-column: 1 / -1;
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    /* Filter & Search Row */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      align-items: center;
    }

    .search-input {
      flex: 1;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--surface-color);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    .toggle-hide-btn {
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--sage);
      background: var(--surface-color);
      color: var(--sage);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .toggle-hide-btn.active {
      background: var(--sage);
      color: #fff;
    }

    /* Category Groups & Items */
    .category-group {
      margin-bottom: 16px;
    }

    .category-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--sage);
      margin-bottom: 6px;
      padding-left: 4px;
    }

    .item-card {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
      animation: slideIn 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      transition: opacity 0.25s ease, background 0.25s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .item-card.checked {
      opacity: 0.62;
      background: var(--surface-alt);
    }

    .item-card.checked .item-name {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

(function () {
// State & LocalStorage keys
const STORAGE_KEY = 'supermarket_list_v1';
const BUDGET_KEY = 'supermarket_budget_v1';
const THEME_KEY = 'supermarket_theme_v1';
let items = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let budgetLimit = parseFloat(localStorage.getItem(BUDGET_KEY)) || 0;
let hideChecked = false;
let searchQuery = '';
let wasOverBudget = false;
// DOM Elements
const listContainer = document.getElementById('listContainer');
const addForm = document.getElementById('addForm');
const itemNameInput = document.getElementById('itemName');
const itemQtyInput = document.getElementById('itemQty');
const itemPriceInput = document.getElementById('itemPrice');
const itemCategorySelect = document.getElementById('itemCategory');
const searchInput = document.getElementById('searchInput');
const toggleHideBtn = document.getElementById('toggleHideBtn');
const progressText = document.getElementById('progressText');
const progressPercent = document.getElementById('progressPercent');
const progressFill = document.getElementById('progressFill');
const rewardMsg = document.getElementById('rewardMsg');
const totalCostEl = document.getElementById('totalCost');
const budgetLimitInput = document.getElementById('budgetLimit');
const remainingTextEl = document.getElementById('remainingText');
const bottomBar = document.getElementById('bottomBar');
const themeToggle = document.getElementById('themeToggle');
// Haptic feedback helper
function vibrate(ms = 25) {
if (navigator.vibrate) {
navigator.vibrate(ms);
}
}
// Format Euro currency
function formatEuro(num) {
return num.toFixed(2).replace('.', ',') + ' €';
}
// Initialize Falling Leaves
function createLeaves() {
const container = document.getElementById('leavesContainer');
const leafIcons = ['🍂', '🍁'];
const leafCount = 10;
for (let i = 0; i < leafCount; i++) {
const leaf = document.createElement('span');
leaf.className = 'leaf';
leaf.textContent = leafIcons[i % leafIcons.length];
leaf.style.left = Math.random() * 95 + '%';
leaf.style.animationDuration = (10 + Math.random() * 10) + 's';
leaf.style.animationDelay = (-Math.random() * 15) + 's';
leaf.style.fontSize = (0.9 + Math.random() * 0.6) + 'rem';
container.appendChild(leaf);
}
}
// Theme Setup
function initTheme() {
const savedTheme = localStorage.getItem(THEME_KEY);
if (savedTheme === 'dark') {
document.body.classList.add('dark');
themeToggle.textContent = '☀️';
}
}
themeToggle.addEventListener('click', () => {
vibrate(20);
document.body.classList.toggle('dark');
const isDark = document.body.classList.contains('dark');
themeToggle.textContent = isDark ? '☀️' : '🌙';
localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
});
// Save to LocalStorage
function saveData() {
localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}
// Add Item Helper
function addItem(name, qty, price, category) {
const cleanName = name.trim();
if (!cleanName) return;
// If exact same unchecked item exists in same category, increment qty
const existing = items.find(
(i) => !i.checked && i.name.toLowerCase() === cleanName.toLowerCase() && i.category === category
);
if (existing) {
existing.qty += qty;
if (price > 0 && existing.price === 0) existing.price = price;
} else {
items.unshift({
id: Date.now().toString() + Math.random().toString(36).slice(2, 6),
name: cleanName,
qty: qty > 0 ? qty : 1,
price: price >= 0 ? price : 0,
category: category || '📦 Άλλα',
checked: false
});
}
vibrate(30);
saveData();
render();
}
// Form Submit
addForm.addEventListener('submit', (e) => {
e.preventDefault();
const name = itemNameInput.value;
const qty = parseInt(itemQtyInput.value, 10) || 1;
const price = parseFloat(itemPriceInput.value) || 0;
const category = itemCategorySelect.value;
addItem(name, qty, price, category);
itemNameInput.value = '';
itemQtyInput.value = '1';
itemPriceInput.value = '';
itemNameInput.focus();
});
// Quick Add Chips
document.getElementById('quickAddBar').addEventListener('click', (e) => {
const btn = e.target.closest('.quick-chip');
if (!btn) return;
addItem(
btn.dataset.name,
1,
parseFloat(btn.dataset.price) || 0,
btn.dataset.cat
);
});
// Search & Hide Checked
searchInput.addEventListener('input', (e) => {
searchQuery = e.target.value.trim().toLowerCase();
render();
});
toggleHideBtn.addEventListener('click', () => {
vibrate(20);
hideChecked = !hideChecked;
toggleHideBtn.classList.toggle('active', hideChecked);
toggleHideBtn.textContent = hideChecked ? 'Εμφάνιση όλων' : 'Απόκρυψη αγορασμένων';
render();
});
// Budget Limit Input
if (budgetLimit > 0) {
budgetLimitInput.value = budgetLimit;
}
budgetLimitInput.addEventListener('input', (e) => {
budgetLimit = parseFloat(e.target.value) || 0;
localStorage.setItem(BUDGET_KEY, budgetLimit);
updateSummary();
});
// Update Progress & Budget Bar
function updateSummary() {
const totalItems = items.length;
const checkedItems = items.filter((i) => i.checked).length;
const percent = totalItems === 0 ? 0 : Math.round((checkedItems / totalItems) * 100);
progressText.textContent = Αγοράστηκαν ${checkedItems} / ${totalItems};
progressPercent.textContent = ${percent}%;
progressFill.style.width = ${percent}%;
if (totalItems > 0 && checkedItems === totalItems) {
progressFill.classList.add('completed');
rewardMsg.classList.add('show');
} else {
progressFill.classList.remove('completed');
rewardMsg.classList.remove('show');
}
const totalCost = items.reduce((sum, item) => sum + item.qty * item.price, 0);
totalCostEl.textContent = formatEuro(totalCost);
if (budgetLimit > 0) {
const diff = budgetLimit - totalCost;
if (diff < 0) {
bottomBar.classList.add('over-budget');
remainingTextEl.textContent = Υπέρβαση: +${formatEuro(Math.abs(diff))};
if (!wasOverBudget) {
bottomBar.classList.remove('shake');
void bottomBar.offsetWidth; // trigger reflow
bottomBar.classList.add('shake');
vibrate([60, 40, 60]);
}
wasOverBudget = true;
} else {
bottomBar.classList.remove('over-budget');
remainingTextEl.textContent = Υπόλοιπο: ${formatEuro(diff)};
wasOverBudget = false;
}
} else {
bottomBar.classList.remove('over-budget');
remainingTextEl.textContent = 'Χωρίς όριο';
wasOverBudget = false;
}
}
// Render Grouped List
function render() {
updateSummary();
const filtered = items.filter((item) => {
if (hideChecked && item.checked) return false;
if (searchQuery && !item.name.toLowerCase().includes(searchQuery)) return false;
return true;
});
if (filtered.length === 0) {
listContainer.innerHTML = <div class="empty-state">🍂 Η λίστα είναι άδεια. Πρόσθεσε προϊόντα από πάνω!</div>;
return;
}
// Group by category
const groups = {};
filtered.forEach((item) => {
if (!groups[item.category]) groups[item.category] = [];
groups[item.category].push(item);
});
listContainer.innerHTML = '';
Object.keys(groups).forEach((cat) => {
const groupDiv = document.createElement('div');
groupDiv.className = 'category-group';
const titleEl = document.createElement('div');
titleEl.className = 'category-title';
titleEl.textContent = cat;
groupDiv.appendChild(titleEl);
groups[cat].forEach((item) => {
const card = document.createElement('div');
card.className = 'item-card' + (item.checked ? ' checked' : '');
card.dataset.id = item.id;
const subtotal = formatEuro(item.qty * item.price);
card.innerHTML = <div class="item-left"> <input type="checkbox" class="custom-checkbox" ${item.checked ? 'checked' : ''} aria-label="Αγοράστηκε ${item.name}" /> <div class="item-info"> <span class="item-name">${escapeHtml(item.name)}</span> <span class="item-subtotal">Σύνολο: ${subtotal}</span> </div> </div> <div class="item-controls"> <div class="qty-box"> <button type="button" class="qty-btn minus" aria-label="Μείωση ποσότητας">−</button> <span class="qty-val">${item.qty}</span> <button type="button" class="qty-btn plus" aria-label="Αύξηση ποσότητας">+</button> </div> <div class="inline-price-wrap" title="Τιμή μονάδας"> <span>€</span> <input type="number" class="inline-price" value="${item.price > 0 ? item.price.toFixed(2) : ''}" placeholder="0.00" min="0" step="0.01" aria-label="Τιμή μονάδας" /> </div> <button type="button" class="del-btn" title="Διαγραφή" aria-label="Διαγραφή">✕</button> </div>;
groupDiv.appendChild(card);
});
listContainer.appendChild(groupDiv);
});
}
// Escape HTML helper
function escapeHtml(str) {
const div = document.createElement('div');
div.textContent = str;
return div.innerHTML;
}
// Event Delegation for List Items
listContainer.addEventListener('click', (e) => {
const card = e.target.closest('.item-card');
if (!card) return;
const id = card.dataset.id;
const item = items.find((i) => i.id === id);
if (!item) return;
if (e.target.classList.contains('custom-checkbox')) {
item.checked = e.target.checked;
vibrate(25);
saveData();
render();
} else if (e.target.classList.contains('minus')) {
vibrate(15);
if (item.qty > 1) {
item.qty -= 1;
} else {
items = items.filter((i) => i.id !== id);
}
saveData();
render();
} else if (e.target.classList.contains('plus')) {
vibrate(15);
item.qty += 1;
saveData();
render();
} else if (e.target.classList.contains('del-btn')) {
vibrate(30);
items = items.filter((i) => i.id !== id);
saveData();
render();
}
});
// Direct Price Edit on List
listContainer.addEventListener('change', (e) => {
if (!e.target.classList.contains('inline-price')) return;
const card = e.target.closest('.item-card');
if (!card) return;
const item = items.find((i) => i.id === card.dataset.id);
if (!item) return;
item.price = Math.max(0, parseFloat(e.target.value) || 0);
saveData();
render();
});
// Clear Checked Items
document.getElementById('clearCheckedBtn').addEventListener('click', () => {
const checkedCount = items.filter((i) => i.checked).length;
if (checkedCount === 0) return;
vibrate(30);
items = items.filter((i) => !i.checked);
saveData();
render();
});
// Clear All Items
document.getElementById('clearAllBtn').addEventListener('click', () => {
if (items.length === 0) return;
if (confirm('Θέλεις σίγουρα να αδειάσεις όλη τη λίστα;')) {
vibrate(40);
items = [];
saveData();
render();
}
});
// Share List (Native Share API or Clipboard fallback)
document.getElementById('shareBtn').addEventListener('click', async () => {
if (items.length === 0) {
alert('Η λίστα σου είναι άδεια!');
return;
}
vibrate(25);
let text = '🛒 Λίστα Σούπερ Μάρκετ\n\n';
const groups = {};
items.forEach((i) => {
if (!groups[i.category]) groups[i.category] = [];
groups[i.category].push(i);
});
Object.keys(groups).forEach((cat) => {
text += ${cat}\n;
groups[cat].forEach((i) => {
const mark = i.checked ? '✅' : '⬜';
const priceStr = i.price > 0 ?  (${formatEuro(i.qty * i.price)}) : '';
text += ${mark} ${i.name} x${i.qty}${priceStr}\n;
});
text += '\n';
});
const total = items.reduce((s, i) => s + i.qty * i.price, 0);
if (total > 0) {
text += 💰 *Σύνολο:* ${formatEuro(total)};
}
if (navigator.share) {
try {
await navigator.share({ title: 'Λίστα Σούπερ Μάρκετ', text });
} catch (err) {
// User cancelled share
}
} else {
await navigator.clipboard.writeText(text);
alert('Η λίστα αντιγράφηκε! Κάνε επικόλληση στο Viber ή το WhatsApp.');
}
});
// Boot
initTheme();
createLeaves();
render();
})();
