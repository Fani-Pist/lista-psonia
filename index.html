<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Λίστα Σούπερ Μάρκετ 🍂</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FAF6F0;
      --card-bg: #FFFDF9;
      --surface-alt: #F3ECE1;
      --text-main: #2F2822;
      --text-muted: #76685C;
      --terracotta: #C85A32;
      --terracotta-hover: #B04A25;
      --sage: #7A9178;
      --sage-light: rgba(122, 145, 120, 0.16);
      --border-color: #E5DDD0;
      --danger: #D93829;
      --danger-bg: #FDECEA;
      --shadow: 0 4px 16px rgba(47, 40, 34, 0.06);
      --bottom-bar-bg: rgba(255, 253, 249, 0.94);
    }

    body.dark-mode {
      --bg-color: #1D1916;
      --card-bg: #27221E;
      --surface-alt: #332C27;
      --text-main: #F4EFE8;
      --text-muted: #A99E93;
      --terracotta: #D96B43;
      --terracotta-hover: #E57A53;
      --sage: #87A385;
      --sage-light: rgba(135, 163, 133, 0.18);
      --border-color: #3D352F;
      --danger: #F05445;
      --danger-bg: #3D1F1C;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      --bottom-bar-bg: rgba(39, 34, 30, 0.94);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 115px;
      transition: background-color 0.3s ease, color 0.3s ease;
      position: relative;
      overflow-x: hidden;
    }

    /* Κινούμενα φθινοπωρινά φύλλα στο φόντο */
    .leaves-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .leaf {
      position: absolute;
      top: -10%;
      opacity: 0.18;
      animation: fall linear infinite;
      user-select: none;
    }

    body.dark-mode .leaf {
      opacity: 0.12;
    }

    @keyframes fall {
      0% {
        transform: translateY(-10vh) rotate(0deg) translateX(0px);
      }
      50% {
        transform: translateY(50vh) rotate(180deg) translateX(25px);
      }
      100% {
        transform: translateY(115vh) rotate(360deg) translateX(-15px);
      }
    }

    /* Κύριο Container */
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 12px;
    }

    .title-group h1 {
      font-size: 1.55rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
    }

    .title-group p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      border-color: var(--terracotta);
      transform: translateY(-1px);
    }

    /* Κάρτες & Ενότητες */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    /* Μπάρα Προόδου */
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: var(--surface-alt);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--sage), #5E7A5C);
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    /* Γρήγορη Προσθήκη */
    .section-label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: block;
    }

    .quick-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .quick-pill {
      background: var(--sage-light);
      color: var(--text-main);
      border: 1px solid rgba(122, 145, 120, 0.35);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .quick-pill:hover {
      background: var(--sage);
      color: #fff;
      transform: translateY(-1px);
    }

    /* Φόρμα Προσθήκης Προϊόντος */
    .add-form {
      display: grid;
      grid-template-columns: 2fr 1.3fr 0.7fr 0.8fr auto;
      gap: 8px;
      align-items: center;
    }

    .add-form input,
    .add-form select,
    .search-input {
      background: var(--surface-alt);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.92rem;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }

    .add-form input:focus,
    .add-form select:focus,
    .search-input:focus {
      border-color: var(--terracotta);
    }

    .btn-primary {
      background: var(--terracotta);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      white-space: nowrap;
    }

    .btn-primary:hover {
      background: var(--terracotta-hover);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* Γραμμή Φίλτρων & Αναζήτησης */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .search-wrapper {
      flex: 1;
      min-width: 200px;
      position: relative;
    }

    .toolbar-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      background: var(--card-bg);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      user-select: none;
    }

    .toggle-label input {
      accent-color: var(--sage);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .btn-clear {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 11px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-clear:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    /* Κατηγορίες & Λίστα Προϊόντων */
    .category-group {
      margin-bottom: 18px;
    }

    .category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 4px;
      margin-bottom: 8px;
      border-bottom: 2px solid var(--border-color);
      font-weight: 700;
      font-size: 0.96rem;
      color: var(--sage);
    }

    .category-count {
      font-size: 0.78rem;
      background: var(--sage-light);
      color: var(--text-main);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item-row {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      transition: all 0.2s ease;
    }

    .item-row.checked {
      opacity: 0.62;
      background: var(--surface-alt);
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .item-checkbox {
      width: 21px;
      height: 21px;
      accent-color: var(--sage);
      cursor: pointer;
      flex-shrink: 0;
    }

    .item-name {
      font-weight: 600;
      font-size: 0.96rem;
      word-break: break-word;
    }

    .item-row.checked .item-name {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .item-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* Έλεγχος Ποσότητας (+/-) */
    .qty-box {
      display: inline-flex;
      align-items: center;
      background: var(--surface-alt);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }

    .qty-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      width: 26px;
      height: 28px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .qty-btn:hover {
      background: var(--terracotta);
color: #fff;
}
.qty-val {
min-width: 24px;
text-align: center;
font-size: 0.86rem;
font-weight: 700;
}
/* Επεξεργασία Τιμής πάνω στη λίστα */
.price-box {
display: inline-flex;
align-items: center;
background: var(--surface-alt);
border: 1px solid var(--border-color);
border-radius: 8px;
padding: 0 6px;
height: 30px;
}
.price-box span {
font-size: 0.82rem;
color: var(--text-muted);
margin-right: 2px;
}
.price-input {
width: 52px;
border: none;
background: transparent;
color: var(--text-main);
font-size: 0.86rem;
font-weight: 600;
text-align: right;
outline: none;
}
.item-subtotal {
font-size: 0.85rem;
font-weight: 700;
color: var(--terracotta);
min-width: 52px;
text-align: right;
}
.delete-btn {
background: transparent;
border: none;
color: var(--text-muted);
cursor: pointer;
font-size: 1.05rem;
padding: 4px;
border-radius: 6px;
transition: color 0.15s, background 0.15s;
}
.delete-btn:hover {
color: var(--danger);
background: var(--danger-bg);
}
.empty-state {
text-align: center;
padding: 36px 16px;
color: var(--text-muted);
background: var(--card-bg);
border: 1px dashed var(--border-color);
border-radius: 16px;
}
.empty-state span {
font-size: 2.2rem;
display: block;
margin-bottom: 8px;
}
/* Σταθερή Κάτω Μπάρα (Σύνολο & Όριο Αγορών) */
.bottom-bar {
position: fixed;
bottom: 0;
left: 0;
right: 0;
background: var(--bottom-bar-bg);
backdrop-filter: blur(10px);
border-top: 2px solid var(--border-color);
padding: 12px 16px;
z-index: 20;
transition: background-color 0.3s ease, border-color 0.3s ease;
}
.bottom-bar.over-budget {
background: var(--danger-bg);
border-top-color: var(--danger);
}
.bottom-inner {
max-width: 720px;
margin: 0 auto;
display: flex;
justify-content: space-between;
align-items: center;
gap: 12px;
flex-wrap: wrap;
}
.budget-control {
display: flex;
align-items: center;
gap: 8px;
font-size: 0.9rem;
font-weight: 600;
}
.budget-input {
width: 82px;
padding: 6px 8px;
border-radius: 8px;
border: 1px solid var(--border-color);
background: var(--card-bg);
color: var(--text-main);
font-weight: 700;
font-size: 0.92rem;
text-align: right;
}
.totals-display {
text-align: right;
}
.grand-total {
font-size: 1.25rem;
font-weight: 700;
color: var(--text-main);
}
.bottom-bar.over-budget .grand-total {
color: var(--danger);
}
.budget-status {
font-size: 0.78rem;
font-weight: 600;
color: var(--sage);
}
.bottom-bar.over-budget .budget-status {
color: var(--danger);
}
/* Toast ειδοποίηση */
.toast {
position: fixed;
top: 18px;
left: 50%;
transform: translateX(-50%) translateY(-20px);
background: var(--text-main);
color: var(--bg-color);
padding: 10px 18px;
border-radius: 999px;
font-size: 0.88rem;
font-weight: 600;
opacity: 0;
pointer-events: none;
transition: all 0.28s ease;
z-index: 50;
box-shadow: 0 6px 20px rgba(0,0,0,0.2);
}
.toast.show {
opacity: 1;
transform: translateX(-50%) translateY(0);
}
/* Responsive για κινητά */
@media (max-width: 640px) {
.add-form {
grid-template-columns: 1fr 1fr;
}
.add-form input[name="name"] {
grid-column: 1 / -1;
}
.add-form button {
grid-column: 1 / -1;
}
.item-row {
flex-wrap: wrap;
}
.item-controls {
width: 100%;
justify-content: flex-end;
padding-top: 4px;
border-top: 1px dashed var(--border-color);
}
}

// Αποθήκευση και Αρχική Κατάσταση
const STORAGE_KEY = 'autumn_supermarket_list_v1';
let state = {
items: [
{ id: 1, name: 'Γάλα', category: '🥛 Γαλακτοκομικά & Ψυγείο', qty: 2, price: 1.45, bought: false },
{ id: 2, name: 'Μήλα', category: '🥬 Φρούτα & Λαχανικά', qty: 4, price: 0.45, bought: true },
{ id: 3, name: 'Ψωμί', category: '🥖 Αρτοποιείο', qty: 1, price: 1.20, bought: false }
],
budget: 50,
hideBought: false,
darkMode: false
};
// Φόρτωση από localStorage
function loadState() {
try {
const saved = localStorage.getItem(STORAGE_KEY);
if (saved) {
const parsed = JSON.parse(saved);
state = { ...state, ...parsed };
}
} catch (e) {
console.error('Σφάλμα φόρτωσης δεδομένων:', e);
}
}
function saveState() {
try {
localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
} catch (e) {
console.error('Σφάλμα αποθήκευσης δεδομένων:', e);
}
}
// Δημιουργία διακριτικών φθινοπωρινών φύλλων
function initLeaves() {
const container = document.getElementById('leavesContainer');
const leafEmojis = ['🍂', '🍁', '🍃'];
const count = 14;
for (let i = 0; i < count; i++) {
const leaf = document.createElement('div');
leaf.className = 'leaf';
leaf.textContent = leafEmojis[i % leafEmojis.length];
leaf.style.left = ${Math.random() * 98}%;
leaf.style.fontSize = ${16 + Math.random() * 14}px;
leaf.style.animationDuration = ${14 + Math.random() * 16}s;
leaf.style.animationDelay = ${-Math.random() * 20}s;
container.appendChild(leaf);
}
}
// Εμφάνιση Toast μηνύματος
let toastTimer;
function showToast(msg) {
const toast = document.getElementById('toast');
toast.textContent = msg;
toast.classList.add('show');
clearTimeout(toastTimer);
toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
}
// Μορφοποίηση Ευρώ
function formatEuro(val) {
return val.toLocaleString('el-GR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
}
// Προσθήκη ή αύξηση υπάρχοντος προϊόντος
function addOrIncrementItem(name, category, qty = 1, price = 0) {
const cleanName = name.trim();
if (!cleanName) return;
const existing = state.items.find(
item => item.name.toLowerCase() === cleanName.toLowerCase() && item.category === category
);
if (existing) {
existing.qty += qty;
if (price > 0 && existing.price === 0) existing.price = price;
existing.bought = false;
showToast(Ενημερώθηκε: ${existing.name} (x${existing.qty}));
} else {
state.items.push({
id: Date.now() + Math.random(),
name: cleanName,
category,
qty: Math.max(1, parseInt(qty, 10) || 1),
price: Math.max(0, parseFloat(price) || 0),
bought: false
});
showToast(Προστέθηκε: ${cleanName});
}
saveState();
render();
}
// Ενημέρωση DOM
function render() {
// Θέμα Dark Mode
document.body.classList.toggle('dark-mode', state.darkMode);
document.getElementById('themeToggle').textContent = state.darkMode ? '☀️' : '🌙';
// Φίλτρα & Όριο
document.getElementById('hideBoughtToggle').checked = state.hideBought;
document.getElementById('budgetLimit').value = state.budget;
const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
// Υπολογισμοί Προόδου & Συνόλου (πάνω σε ΟΛΑ τα προϊόντα)
const totalItems = state.items.length;
const boughtItems = state.items.filter(i => i.bought).length;
const pct = totalItems === 0 ? 0 : Math.round((boughtItems / totalItems) * 100);
document.getElementById('progressText').textContent = ${boughtItems} / ${totalItems} προϊόντα (${pct}%);
document.getElementById('progressFill').style.width = ${pct}%;
const grandTotal = state.items.reduce((sum, item) => sum + (item.qty * item.price), 0);
const budget = parseFloat(state.budget) || 0;
const diff = budget - grandTotal;
const bottomBar = document.getElementById('bottomBar');
const grandTotalEl = document.getElementById('grandTotal');
const budgetStatusEl = document.getElementById('budgetStatus');
grandTotalEl.textContent = Σύνολο: ${formatEuro(grandTotal)};
if (budget > 0 && grandTotal > budget) {
bottomBar.classList.add('over-budget');
budgetStatusEl.textContent = ⚠️ Υπέρβαση κατά ${formatEuro(Math.abs(diff))};
} else {
bottomBar.classList.remove('over-budget');
budgetStatusEl.textContent = budget > 0
? Υπόλοιπο: ${formatEuro(diff)}
: 'Χωρίς όριο αγορών';
}
// Φιλτράρισμα για εμφάνιση
const visibleItems = state.items.filter(item => {
if (state.hideBought && item.bought) return false;
if (searchTerm && !item.name.toLowerCase().includes(searchTerm)) return false;
return true;
});
const listContainer = document.getElementById('listContainer');
listContainer.innerHTML = '';
if (visibleItems.length === 0) {
listContainer.innerHTML = <div class="empty-state"> <span>🧺</span> <p>${state.items.length === 0 ? 'Η λίστα σας είναι άδεια. Προσθέστε προϊόντα παραπάνω!' : 'Δεν βρέθηκαν προϊόντα με τα τρέχοντα φίλτρα.'}</p> </div>;
return;
}
// Ομαδοποίηση ανά κατηγορία
const grouped = {};
visibleItems.forEach(item => {
if (!grouped[item.category]) grouped[item.category] = [];
grouped[item.category].push(item);
});
Object.keys(grouped).forEach(category => {
const groupDiv = document.createElement('div');
groupDiv.className = 'category-group';
const catItems = grouped[category];
groupDiv.innerHTML = <div class="category-header"> <span>${category}</span> <span class="category-count">${catItems.length}</span> </div> <div class="item-list"></div>;
const ul = groupDiv.querySelector('.item-list');
catItems.forEach(item => {
const row = document.createElement('div');
row.className = item-row ${item.bought ? 'checked' : ''};
const subtotal = item.qty * item.price;

function escapeHtml(str) {
const div = document.createElement('div');
div.textContent = str;
return div.innerHTML;
}
// Αρχικοποίηση Events
document.addEventListener('DOMContentLoaded', () => {
loadState();
initLeaves();
render();
// Υποβολή φόρμας
document.getElementById('addForm').addEventListener('submit', (e) => {
e.preventDefault();
const nameInput = document.getElementById('itemName');
const catInput = document.getElementById('itemCategory');
const qtyInput = document.getElementById('itemQty');
const priceInput = document.getElementById('itemPrice');
addOrIncrementItem(nameInput.value, catInput.value, qtyInput.value, priceInput.value);
nameInput.value = '';
qtyInput.value = '1';
priceInput.value = '';
nameInput.focus();
});
// Γρήγορη προσθήκη (1 πάτημα)
document.getElementById('quickAddContainer').addEventListener('click', (e) => {
const pill = e.target.closest('.quick-pill');
if (!pill) return;
addOrIncrementItem(
pill.dataset.name,
pill.dataset.cat,
1,
parseFloat(pill.dataset.price)
);
});
// Αναζήτηση
document.getElementById('searchInput').addEventListener('input', render);
// Απόκρυψη αγορασμένων
document.getElementById('hideBoughtToggle').addEventListener('change', (e) => {
state.hideBought = e.target.checked;
saveState();
render();
});
// Καθαρισμός αγορασμένων
document.getElementById('clearBoughtBtn').addEventListener('click', () => {
const boughtCount = state.items.filter(i => i.bought).length;
if (boughtCount === 0) {
showToast('Δεν υπάρχουν αγορασμένα προϊόντα');
return;
}
state.items = state.items.filter(i => !i.bought);
saveState();
render();
showToast(Διαγράφηκαν ${boughtCount} αγορασμένα προϊόντα);
});
// Όριο αγορών (€)
document.getElementById('budgetLimit').addEventListener('input', (e) => {
state.budget = Math.max(0, parseFloat(e.target.value) || 0);
saveState();
render();
});
// Εναλλαγή Dark Mode
document.getElementById('themeToggle').addEventListener('click', () => {
state.darkMode = !state.darkMode;
saveState();
render();
});
// Κοινοποίηση Λίστας
document.getElementById('shareBtn').addEventListener('click', async () => {
if (state.items.length === 0) {
showToast('Η λίστα είναι άδεια!');
return;
}
const total = state.items.reduce((s, i) => s + (i.qty * i.price), 0);
let text = '🍂 Λίστα Σούπερ Μάρκετ:\n\n';
const grouped = {};
state.items.forEach(item => {
if (!grouped[item.category]) grouped[item.category] = [];
grouped[item.category].push(item);
});
Object.keys(grouped).forEach(cat => {
text += ${cat}\n;
grouped[cat].forEach(item => {
const mark = item.bought ? '✅' : '⬜';
const pricePart = item.price > 0 ?  (${formatEuro(item.qty * item.price)}) : '';
text += ${mark} ${item.name} x${item.qty}${pricePart}\n;
});
text += '\n';
});
text += 💰 Εκτιμώμενο Σύνολο: ${formatEuro(total)};
if (navigator.share) {
try {
await navigator.share({ title: 'Λίστα Σούπερ Μάρκετ', text });
return;
} catch (err) {
if (err.name === 'AbortError') return;
}
}
try {
await navigator.clipboard.writeText(text);
showToast('📋 Η λίστα αντιγράφηκε στο πρόχειρο!');
} catch {
showToast('Δεν ήταν δυνατή η αντιγραφή');
}
});
});
