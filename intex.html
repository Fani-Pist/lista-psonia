  <title>Λίστα Σούπερ Μάρκετ 🛒</title>

  <style>
    :root {
      --bg: #FAF6F0;
      --surface: #FFFFFF;
      --surface-alt: #F3ECE1;
      --text: #2E2A25;
      --text-muted: #766E64;
      --terracotta: #C85A32;
      --terracotta-dark: #A64623;
      --sage: #6B705C;
      --sage-light: #E6E9DF;
      --border: #E5DDD0;
      --danger: #D62828;
      --danger-bg: #FDECEC;
      --success: #3A7D44;
      --shadow: 0 4px 14px rgba(46, 42, 37, 0.07);
      --bottom-bar-bg: rgba(255, 255, 255, 0.96);
    }

    body.dark {
      --bg: #1B1815;
      --surface: #26221E;
      --surface-alt: #322C26;
      --text: #F4EFE8;
      --text-muted: #A99F94;
      --terracotta: #DF6D43;
      --terracotta-dark: #C85A32;
      --sage: #8A9177;
      --sage-light: #2E3328;
      --border: #3B342D;
      --danger: #FF5A5F;
      --danger-bg: #3D1E20;
      --success: #52B765;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      --bottom-bar-bg: rgba(38, 34, 30, 0.96);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.3s ease, color 0.3s ease;
      padding-bottom: 135px; /* Χώρος για την κάτω σταθερή μπάρα */
      overflow-x: hidden;
    }

    /* Φθινοπωρινά φύλλα στο φόντο */
    #leaves-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .leaf {
      position: absolute;
      top: -40px;
      font-size: 20px;
      opacity: 0.45;
      user-select: none;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(-40px) translateX(0) rotate(0deg);
      }
      50% {
        transform: translateY(50vh) translateX(25px) rotate(180deg);
      }
      100% {
        transform: translateY(108vh) translateX(-15px) rotate(360deg);
      }
    }

    /* Κύριο Container */
    .app-container {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 0 auto;
      padding: 14px 14px 24px;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-float {
      font-size: 32px;
      display: inline-block;
      animation: floatLogo 3s ease-in-out infinite;
      filter: drop-shadow(0 4px 6px rgba(200, 90, 50, 0.25));
    }

    @keyframes floatLogo {
      0%, 100% { transform: translateY(0px) rotate(-3deg); }
      50% { transform: translateY(-6px) rotate(4deg); }
    }

    h1 {
      font-size: 1.32rem;
      margin: 0;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .theme-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease, background-color 0.3s;
    }

    /* Κουμπιά με εφέ πατήματος */
    button:active {
      transform: scale(0.94);
    }

    /* Κάρτες */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    /* Μπάρα Προόδου */
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.86rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .progress-track {
      width: 100%;
      height: 12px;
      background: var(--surface-alt);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--terracotta), #E07A5F);
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1), background 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .progress-fill.completed {
      background: linear-gradient(90deg, var(--sage), var(--success));
    }

    /* Shimmer effect στη μπάρα προόδου */
    .progress-fill::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.45) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      animation: shimmer 2.2s infinite;
    }

    @keyframes shimmer {
      100% { left: 180%; }
    }

    .reward-msg {
      display: none;
      margin-top: 8px;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--success);
      text-align: center;
      animation: popIn 0.35s ease;
    }

    .reward-msg.show {
      display: block;
    }

    /* Γρήγορη Προσθήκη (1 πάτημα) */
    .quick-bar-title {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 8px;
    }

    .quick-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .quick-scroll::-webkit-scrollbar {
      display: none;
    }

    .quick-chip {
      flex: 0 0 auto;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.2s, transform 0.12s;
    }

    .quick-chip:hover {
      border-color: var(--terracotta);
    }

    /* Φόρμα Προσθήκης */
    .add-form {
      display: grid;
      grid-template-columns: 1fr 74px 82px;
      gap: 8px;
    }

    .add-form-bottom {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-top: 8px;
    }

    input, select {
      width: 100%;
      padding: 10px 11px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.94rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--terracotta);
    }

    .btn-primary {
      background: var(--terracotta);
      color: #fff;
      border: none;
      border-radius: 11px;
      padding: 10px 16px;
      font-size: 0.94rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s, transform 0.12s;
    }

    .btn-primary:hover {
      background: var(--terracotta-dark);
    }

    /* Φίλτρα: Αναζήτηση & Απόκρυψη αγορασμένων */
    .controls-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }

    .search-box {
      position: relative;
      flex: 1;
    }

    .search-box input {
      padding-left: 34px;
      background: var(--surface);
      border-radius: 12px;
    }

    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.92rem;
      opacity: 0.65;
      pointer-events: none;
    }

    .toggle-hide-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .toggle-hide-btn.active {
      background: var(--sage);
      color: #fff;
      border-color: var(--sage);
    }

    /* Ομαδοποίηση Κατηγοριών */
    .category-group {
      margin-bottom: 14px;
    }

    .category-header {
      font-size: 0.84rem;
      font-weight: 800;
      color: var(--sage);
      background: var(--sage-light);
      padding: 6px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Στοιχείο Λίστας + Pop-in Animation */
    .item-card {
      background: var(--surface);
      border: 1px solid var(--border);
border-radius: 14px;
padding: 10px 12px;
margin-bottom: 8px;
display: flex;
align-items: center;
gap: 10px;
box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
transition: opacity 0.25s ease, transform 0.2s ease, background-color 0.25s;
}
.item-card.pop-in {
animation: popIn 0.34s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes popIn {
0% {
opacity: 0;
transform: scale(0.86) translateY(10px);
}
100% {
opacity: 1;
transform: scale(1) translateY(0);
}
}
.item-card.checked {
opacity: 0.58;
background: var(--surface-alt);
}
.item-card.checked .item-name {
text-decoration: line-through;
color: var(--text-muted);
}
/* Checkbox */
.check-btn {
width: 26px;
height: 26px;
border-radius: 8px;
border: 2px solid var(--terracotta);
background: transparent;
color: #fff;
font-size: 0.95rem;
font-weight: bold;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
flex-shrink: 0;
padding: 0;
transition: background 0.2s, border-color 0.2s;
}
.item-card.checked .check-btn {
background: var(--sage);
border-color: var(--sage);
}
.item-info {
flex: 1;
min-width: 0;
}
.item-name {
font-weight: 700;
font-size: 0.98rem;
word-break: break-word;
}
.item-sub {
font-size: 0.78rem;
color: var(--text-muted);
margin-top: 2px;
}
/* Controls Ποσότητας & Τιμής πάνω στη λίστα */
.item-actions {
display: flex;
align-items: center;
gap: 6px;
flex-shrink: 0;
}
.qty-box {
display: inline-flex;
align-items: center;
background: var(--bg);
border: 1px solid var(--border);
border-radius: 9px;
overflow: hidden;
}
.qty-btn {
background: transparent;
border: none;
color: var(--terracotta);
font-weight: 900;
font-size: 1rem;
width: 26px;
height: 28px;
cursor: pointer;
padding: 0;
}
.qty-val {
font-size: 0.85rem;
font-weight: 700;
min-width: 20px;
text-align: center;
}
.inline-price-wrap {
display: inline-flex;
align-items: center;
background: var(--bg);
border: 1px solid var(--border);
border-radius: 9px;
padding: 0 5px;
height: 30px;
}
.inline-price-wrap span {
font-size: 0.78rem;
color: var(--text-muted);
margin-right: 2px;
}
.inline-price {
width: 48px;
border: none;
background: transparent;
padding: 2px 0;
font-size: 0.84rem;
font-weight: 700;
text-align: right;
color: var(--text);
}
.del-btn {
background: transparent;
border: none;
color: var(--text-muted);
font-size: 1rem;
cursor: pointer;
padding: 4px;
opacity: 0.7;
}
.del-btn:hover {
color: var(--danger);
opacity: 1;
}
/* Κενή Κατάσταση */
.empty-state {
text-align: center;
padding: 34px 16px;
color: var(--text-muted);
font-size: 0.94rem;
}
.empty-state .emoji {
font-size: 2.4rem;
display: block;
margin-bottom: 8px;
}
/* Δευτερεύουσες Ενέργειες (Κοινοποίηση, Σβήσιμο, Καθαρισμός) */
.bulk-actions {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 8px;
margin-top: 14px;
}
.btn-secondary {
background: var(--surface);
border: 1px solid var(--border);
color: var(--text);
padding: 10px 10px;
border-radius: 12px;
font-size: 0.82rem;
font-weight: 700;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
gap: 5px;
box-shadow: var(--shadow);
}
.btn-share {
background: var(--sage);
color: #fff;
border-color: var(--sage);
}
.btn-danger-outline {
grid-column: span 2;
color: var(--danger);
border-color: rgba(214, 40, 40, 0.3);
}
/* Link Κέρασέ με έναν καφέ */
.coffee-footer {
text-align: center;
margin-top: 22px;
margin-bottom: 10px;
}
.coffee-link {
display: inline-block;
font-size: 0.82rem;
color: var(--text-muted);
text-decoration: none;
padding: 6px 12px;
border-radius: 999px;
background: var(--surface-alt);
border: 1px solid var(--border);
transition: color 0.2s, border-color 0.2s;
}
.coffee-link:hover {
color: var(--terracotta);
border-color: var(--terracotta);
}
/* Σταθερή Κάτω Μπάρα */
.bottom-bar {
position: fixed;
bottom: 0;
left: 0;
right: 0;
z-index: 20;
background: var(--bottom-bar-bg);
backdrop-filter: blur(10px);
-webkit-backdrop-filter: blur(10px);
border-top: 1px solid var(--border);
box-shadow: 0 -4px 18px rgba(0, 0, 0, 0.08);
padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
transition: background-color 0.3s ease, border-color 0.3s ease;
}
.bottom-bar.over-budget {
background: var(--danger-bg);
border-top: 2px solid var(--danger);
}
/* Shake Animation όταν ξεπεραστεί το όριο */
.bottom-bar.shake {
animation: shakeBar 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
}
@keyframes shakeBar {
10%, 90% { transform: translateX(-2px); }
20%, 80% { transform: translateX(4px); }
30%, 50%, 70% { transform: translateX(-6px); }
40%, 60% { transform: translateX(6px); }
}
.bottom-inner {
max-width: 560px;
margin: 0 auto;
display: flex;
align-items: center;
justify-content: space-between;
gap: 10px;
}
.total-block {
display: flex;
flex-direction: column;
}
.total-label {
font-size: 0.74rem;
color: var(--text-muted);
font-weight: 700;
text-transform: uppercase;
}
.total-amount {
font-size: 1.35rem;
font-weight: 900;
color: var(--terracotta);
line-height: 1.15;
}
.bottom-bar.over-budget .total-amount {
color: var(--danger);
}
.remaining-text {
font-size: 0.78rem;
font-weight: 700;
color: var(--sage);
margin-top: 2px;
}
.bottom-bar.over-budget .remaining-text {
color: var(--danger);
}
.budget-box {
display: flex;
flex-direction: column;
align-items: flex-end;
}
.budget-box label {
font-size: 0.74rem;
font-weight: 700;
color: var(--text-muted);
margin-bottom: 3px;
}
.budget-input-wrap {
display: flex;
align-items: center;
background: var(--surface);
border: 1px solid var(--border);
border-radius: 10px;
padding: 4px 8px;
width: 112px;
}
.budget-input-wrap input {
border: none;
background: transparent;
padding: 2px 4px;
font-weight: 800;
font-size: 0.95rem;
text-align: right;
}
/* Toast ειδοποίηση */
.toast {
position: fixed;
top: 16px;
left: 50%;
transform: translateX(-50%) translateY(-80px);
background: var(--text);
color: var(--bg);
padding: 9px 16px;
border-radius: 999px;
font-size: 0.84rem;
font-weight: 700;
z-index: 50;
box-shadow: 0 6px 18px rgba(0,0,0,0.2);
transition: transform 0.3s ease;
pointer-events: none;
}
.toast.show {
transform: translateX(-50%) translateY(0);
}

}
const savedTheme = localStorage.getItem(THEME_KEY);
if (savedTheme === "dark") {
document.body.classList.add("dark");
themeToggle.textContent = "☀️";
themeMeta.setAttribute("content", "#1B1815");
}
} catch (e) {
console.error("Σφάλμα φόρτωσης:", e);
}
}
function saveState() {
try {
localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
localStorage.setItem(BUDGET_KEY, budget);
} catch (e) {
console.error("Σφάλμα αποθήκευσης:", e);
}
}
// Δημιουργία φθινοπωρινών φύλλων στο φόντο
function initAutumnLeaves() {
const container = document.getElementById("leaves-container");
const leafEmojis = ["🍂", "🍁"];
const count = 12;
for (let i = 0; i < count; i++) {
const span = document.createElement("span");
span.className = "leaf";
span.textContent = leafEmojis[i % 2];
span.style.left = Math.random() * 96 + "%";
span.style.fontSize = (15 + Math.random() * 11) + "px";
span.style.animationDuration = (11 + Math.random() * 12) + "s";
span.style.animationDelay = (-Math.random() * 15) + "s";
container.appendChild(span);
}
}
// Προσθήκη Προϊόντος
function addItem(name, qty, price, category) {
const cleanName = name.trim();
if (!cleanName) return;
// Αν υπάρχει ήδη το ίδιο προϊόν (μη αγορασμένο), αύξησε την ποσότητα
const existing = items.find(
it => it.name.toLowerCase() === cleanName.toLowerCase() && !it.checked
);
if (existing) {
existing.qty += Math.max(1, parseInt(qty, 10) || 1);
if (price > 0) existing.price = parseFloat(price);
lastAddedId = existing.id;
showToast(➕ Αυξήθηκε: ${existing.name} (${existing.qty}));
} else {
const newId = Date.now().toString() + Math.random().toString(36).slice(2, 6);
items.unshift({
id: newId,
name: cleanName,
qty: Math.max(1, parseInt(qty, 10) || 1),
price: Math.max(0, parseFloat(price) || 0),
category: category || "📦 Άλλα",
checked: false
});
lastAddedId = newId;
showToast(✅ Προστέθηκε: ${cleanName});
}
vibrate(20);
saveState();
render();
}
// Ενημέρωση Μπάρας Προόδου & Κάτω Μπάρας Οικονομικών
function updateStats() {
const totalItems = items.length;
const checkedItems = items.filter(i => i.checked).length;
const pct = totalItems === 0 ? 0 : Math.round((checkedItems / totalItems) * 100);
progressLabel.textContent = Αγοράστηκαν ${checkedItems} / ${totalItems};
progressPercent.textContent = ${pct}%;
progressFill.style.width = ${pct}%;
if (totalItems > 0 && checkedItems === totalItems) {
progressFill.classList.add("completed");
rewardMsg.classList.add("show");
} else {
progressFill.classList.remove("completed");
rewardMsg.classList.remove("show");
}
// Υπολογισμός συνολικού κόστους
const totalCost = items.reduce((sum, item) => sum + (item.qty * item.price), 0);
totalCostEl.textContent = formatEuro(totalCost);
const parsedBudget = parseFloat(budget);
if (!isNaN(parsedBudget) && parsedBudget > 0) {
const diff = parsedBudget - totalCost;
if (diff < 0) {
bottomBar.classList.add("over-budget");
budgetStatusEl.textContent = ⚠️ Υπέρβαση κατά ${formatEuro(Math.abs(diff))};
if (!wasOverBudget) {
bottomBar.classList.remove("shake");
void bottomBar.offsetWidth; // trigger reflow
bottomBar.classList.add("shake");
vibrate([40, 40, 60]);
}
wasOverBudget = true;
} else {
bottomBar.classList.remove("over-budget", "shake");
budgetStatusEl.textContent = Υπόλοιπο: ${formatEuro(diff)};
wasOverBudget = false;
}
} else {
bottomBar.classList.remove("over-budget", "shake");
budgetStatusEl.textContent = "Ορίστε όριο δεξιά →";
wasOverBudget = false;
}
}
// Απόδοση (Render) Λίστας
function render() {
updateStats();
const filtered = items.filter(item => {
if (hideChecked && item.checked) return false;
if (searchQuery && !item.name.toLowerCase().includes(searchQuery.toLowerCase())) return false;
return true;
});
if (filtered.length === 0) {
listContainer.innerHTML = <div class="empty-state"> <span class="emoji">${items.length === 0 ? "🧺" : "🔍"}</span> ${items.length === 0 ? "Η λίστα σου είναι άδεια. Πρόσθεσε προϊόντα από πάνω!" : "Δεν βρέθηκαν προϊόντα με αυτά τα κριτήρια."} </div>;
return;
}
// Ομαδοποίηση ανά κατηγορία
const groups = {};
filtered.forEach(item => {
if (!groups[item.category]) groups[item.category] = [];
groups[item.category].push(item);
});
listContainer.innerHTML = "";
Object.keys(groups).forEach(cat => {
const groupDiv = document.createElement("div");
groupDiv.className = "category-group";
const catItems = groups[cat];
const catTotal = catItems.reduce((s, i) => s + i.qty * i.price, 0);
const headerDiv = document.createElement("div");
headerDiv.className = "category-header";
headerDiv.innerHTML = <span>${cat} (${catItems.length})</span> <span>${catTotal > 0 ? formatEuro(catTotal) : ""}</span>;
groupDiv.appendChild(headerDiv);
catItems.forEach(item => {
const card = document.createElement("div");
card.className = "item-card" + (item.checked ? " checked" : "") + (item.id === lastAddedId ? " pop-in" : "");
const subtotal = item.qty * item.price;
card.innerHTML = <button type="button" class="check-btn" aria-label="Τσεκάρισμα">${item.checked ? "✓" : ""}</button> <div class="item-info"> <div class="item-name">${escapeHtml(item.name)}</div> <div class="item-sub">Σύνολο: <strong>${formatEuro(subtotal)}</strong></div> </div> <div class="item-actions"> <div class="qty-box"> <button type="button" class="qty-btn minus" aria-label="Μείωση">−</button> <span class="qty-val">${item.qty}</span> <button type="button" class="qty-btn plus" aria-label="Αύξηση">+</button> </div> <div class="inline-price-wrap" title="Τιμή μονάδας (€)"> <span>€</span> <input type="number" class="inline-price" value="${item.price > 0 ? item.price : ""}" placeholder="0.00" min="0" step="0.01" aria-label="Τιμή μονάδας" /> </div> <button type="button" class="del-btn" title="Διαγραφή" aria-label="Διαγραφή">✕</button> </div>;
// Event Listeners στοιχείου
card.querySelector(".check-btn").addEventListener("click", () => {
item.checked = !item.checked;
lastAddedId = null;
vibrate(item.checked ? 25 : 12);
saveState();
render();
});
card.querySelector(".minus").addEventListener("click", () => {
if (item.qty > 1) {
item.qty -= 1;
lastAddedId = null;
vibrate(12);
saveState();
render();
}
});
card.querySelector(".plus").addEventListener("click", () => {
item.qty += 1;
lastAddedId = null;
vibrate(12);
saveState();
render();
});
const inlinePriceInput = card.querySelector(".inline-price");
inlinePriceInput.addEventListener("change", (e) => {
const val = parseFloat(e.target.value);
item.price = isNaN(val) || val < 0 ? 0 : val;
lastAddedId = null;
saveState();
render();
});
card.querySelector(".del-btn").addEventListener("click", () => {
items = items.filter(i => i.id !== item.id);
lastAddedId = null;
vibrate(30);
saveState();
render();
});
groupDiv.appendChild(card);
});
listContainer.appendChild(groupDiv);
});
lastAddedId = null;
}
function escapeHtml(str) {
const div = document.createElement("div");
div.textContent = str;
return div.innerHTML;
}
// Υποβολή Φόρμας
addForm.addEventListener("submit", (e) => {
e.preventDefault();
addItem(nameInput.value, qtyInput.value, priceInput.value, categorySelect.value);
nameInput.value = "";
qtyInput.value = "1";
priceInput.value = "";
nameInput.focus();
});
// Γρήγορα Κουμπιά 1 Πατήματος
document.getElementById("quick-bar").addEventListener("click", (e) => {
const btn = e.target.closest(".quick-chip");
if (!btn) return;
addItem(btn.dataset.name, 1, parseFloat(btn.dataset.price), btn.dataset.cat);
});
// Αναζήτηση
searchInput.addEventListener("input", (e) => {
searchQuery = e.target.value;
render();
});
// Απόκρυψη αγορασμένων
hideCheckedBtn.addEventListener("click", () => {
hideChecked = !hideChecked;
hideCheckedBtn.classList.toggle("active", hideChecked);
hideCheckedBtn.textContent = hideChecked ? "🙈 Εμφάνιση όλων" : "👁️ Απόκρυψη αγορασμένων";
vibrate(15);
render();
});
// Αλλαγή Ορίου (€)
budgetInput.addEventListener("input", (e) => {
budget = e.target.value;
saveState();
updateStats();
});
// Σβήσιμο Αγορασμένων
document.getElementById("clear-checked-btn").addEventListener("click", () => {
const count = items.filter(i => i.checked).length;
if (count === 0) {
showToast("Δεν υπάρχουν αγορασμένα προϊόντα");
return;
}
items = items.filter(i => !i.checked);
vibrate(25);
saveState();
render();
showToast(🧹 Σβήστηκαν ${count} αγορασμένα);
});
// Καθαρισμός Όλης της Λίστας
document.getElementById("clear-all-btn").addEventListener("click", () => {
if (items.length === 0) return;
if (confirm("Θέλεις σίγουρα να διαγράψεις όλα τα προϊόντα της λίστας;")) {
items = [];
vibrate([30, 50, 30]);
saveState();
render();
showToast("🗑️ Η λίστα καθαρίστηκε");
}
});
// Κοινοποίηση Λίστας (Viber / WhatsApp / Clipboard)
document.getElementById("share-btn").addEventListener("click", async () => {
if (items.length === 0) {
showToast("Η λίστα είναι άδεια!");
return;
}
const total = items.reduce((s, i) => s + i.qty * i.price, 0);
let text = "🛒 Λίστα Σούπερ Μάρκετ\n\n";
const groups = {};
items.forEach(item => {
if (!groups[item.category]) groups[item.category] = [];
groups[item.category].push(item);
});
Object.keys(groups).forEach(cat => {
text += ${cat}\n;
groups[cat].forEach(it => {
const mark = it.checked ? "✅" : "⬜";
const priceStr = it.price > 0 ?  (${formatEuro(it.qty * it.price)}) : "";
text += ${mark} ${it.name} x${it.qty}${priceStr}\n;
});
text += "\n";
});
text += 💰 *Σύνολο: ${formatEuro(total)}*;
vibrate(20);
if (navigator.share) {
try {
await navigator.share({
title: "Λίστα Σούπερ Μάρκετ",
text: text
});
return;
} catch (err) {
// Αν ακυρωθεί ή αποτύχει, συνεχίζει σε αντιγραφή
}
}
try {
await navigator.clipboard.writeText(text);
showToast("📋 Αντιγράφηκε! Έτοιμο για Viber/WhatsApp");
} catch (err) {
alert(text);
}
});
// Dark Mode Toggle
themeToggle.addEventListener("click", () => {
const isDark = document.body.classList.toggle("dark");
themeToggle.textContent = isDark ? "☀️" : "🌙";
themeMeta.setAttribute("content", isDark ? "#1B1815" : "#FAF6F0");
localStorage.setItem(THEME_KEY, isDark ? "dark" : "light");
vibrate(15);
});
// Εκκίνηση
initAutumnLeaves();
loadState();
render();
})();
