  <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FAF6F0;
      --surface-color: #FFFFFF;
      --surface-alt: #F2EBE1;
      --primary: #C85A32;
      --primary-hover: #B04A25;
      --secondary: #738A6E;
      --secondary-light: #E8EFE6;
      --text-main: #2D2620;
      --text-muted: #786D63;
      --border-color: #E6DDD0;
      --danger: #D9383A;
      --danger-bg: #FDECEC;
      --shadow: 0 4px 14px rgba(45, 38, 32, 0.06);
      --bottom-bar-bg: rgba(255, 255, 255, 0.94);
    }

    [data-theme="dark"] {
      --bg-color: #1C1917;
      --surface-color: #292524;
      --surface-alt: #342F2D;
      --primary: #E06D44;
      --primary-hover: #C85A32;
      --secondary: #8BA385;
      --secondary-light: #2C352A;
      --text-main: #F5F2EB;
      --text-muted: #A89F96;
      --border-color: #3F3936;
      --danger: #EF5350;
      --danger-bg: #3D1F1F;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      --bottom-bar-bg: rgba(41, 37, 36, 0.94);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      transition: background-color 0.3s ease, color 0.3s ease;
      padding-bottom: 110px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Κινούμενα Φθινοπωρινά Φύλλα */
    .leaves-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .leaf {
      position: absolute;
      top: -40px;
      opacity: 0.22;
      animation: fall linear infinite;
      user-select: none;
    }

    [data-theme="dark"] .leaf {
      opacity: 0.14;
    }

    @keyframes fall {
      0% {
        transform: translateY(-40px) rotate(0deg) translateX(0px);
      }
      50% {
        transform: translateY(50vh) rotate(180deg) translateX(25px);
      }
      100% {
        transform: translateY(105vh) rotate(360deg) translateX(-15px);
      }
    }

    /* Κύριο Container (Mobile-First) */
    .app-container {
      max-width: 540px;
      margin: 0 auto;
      padding: 16px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .title-area h1 {
      font-size: 1.45rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease, background-color 0.2s;
    }

    .icon-btn:active {
      transform: scale(0.93);
    }

    /* Μπάρα Προόδου */
    .progress-card {
      background: var(--surface-color);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-muted);
    }

    .progress-header span:last-child {
      color: var(--secondary);
      font-weight: 700;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: var(--surface-alt);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--secondary);
      width: 0%;
      border-radius: 99px;
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Γρήγορη Προσθήκη */
    .section-label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .quick-add-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }

    .quick-add-scroll::-webkit-scrollbar {
      display: none;
    }

    .quick-chip {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      transition: all 0.15s ease;
    }

    .quick-chip:active {
      transform: scale(0.94);
      background: var(--secondary-light);
      border-color: var(--secondary);
    }

    /* Φόρμα Προσθήκης Είδους */
    .add-form {
      background: var(--surface-color);
      padding: 12px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .form-row {
      display: flex;
      gap: 8px;
    }

    input, select {
      font-family: inherit;
      background: var(--surface-alt);
      border: 1px solid transparent;
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .input-name {
      flex: 1;
      min-width: 0;
    }

    .input-price {
      width: 85px;
      text-align: right;
    }

    .select-category {
      flex: 1;
    }

    .btn-add {
      background: var(--primary);
      color: #FFFFFF;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      white-space: nowrap;
    }

    .btn-add:hover {
      background: var(--primary-hover);
    }

    .btn-add:active {
      transform: scale(0.96);
    }

    /* Αναζήτηση & Φίλτρα */
    .controls-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      align-items: center;
    }

    .search-box {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box span {
      position: absolute;
      left: 12px;
      font-size: 0.95rem;
      opacity: 0.6;
    }

    .search-box input {
      width: 100%;
      padding-left: 34px;
      background: var(--surface-color);
      border: 1px solid var(--border-color);
    }

    .toggle-hide-btn {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .toggle-hide-btn.active {
      background: var(--secondary-light);
      color: var(--secondary);
      border-color: var(--secondary);
    }

    /* Λίστα & Κατηγορίες */
    .category-group {
      margin-bottom: 18px;
    }

    .category-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding-left: 4px;
    }

    .item-card {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      transition: opacity 0.25s, transform 0.2s, background-color 0.2s;
    }

    .item-card.checked {
      opacity: 0.58;
      background: var(--surface-alt);
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

      width: 24px;
      height: 24px;

      border: 2px solid var(--secondary);
      display: flex;

      flex-shrink: 0;

      font-size: 0.85rem;
      font-weight: bold;
    }

    .item-card.checked .custom-checkbox {
      background: var(--secondary);
    }

    .item-name {
      font-weight: 600;
      font-size: 0.95rem;
      word-break: break-word;
    }

      text-decoration: line-through;

    }

      display: flex;

      padding: 2px;
