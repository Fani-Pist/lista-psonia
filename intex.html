<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#C85A32">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Λίστα Σούπερ Μάρκετ 🛒</title>

    <!-- Favicon & Apple Touch Icon (SVG Data URI Καλάθι) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23C85A32'/><text x='50' y='68' font-size='55' text-anchor='middle'>🛒</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23C85A32'/><text x='50' y='68' font-size='55' text-anchor='middle'>🛒</text></svg>">

    <style>
        :root {
            --bg-color: #FAF6F0;
            --card-bg: #FFFFFF;
            --text-main: #2C2A29;
            --text-muted: #6B705C;
            --terracotta: #C85A32;
            --terracotta-dark: #A84622;
            --sage: #6B705C;
            --sage-light: #E8EBE4;
            --border-color: #E6DFD5;
            --success: #3A7D44;
            --danger: #D62828;
            --shadow: 0 4px 14px rgba(44, 42, 41, 0.06);
        }

        body.dark-mode {
            --bg-color: #1C1A18;
            --card-bg: #282522;
            --text-main: #F4EFEA;
            --text-muted: #A5A89B;
            --terracotta: #E06D44;
            --terracotta-dark: #C85A32;
            --sage: #8C927B;
            --sage-light: #353831;
            --border-color: #3D3834;
            --success: #4CAF50;
            --danger: #FF5252;
            --shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
            padding-bottom: 155px; /* Χώρος για τη σταθερή κάτω μπάρα */
            overflow-x: hidden;
        }

        /* Φθινοπωρινά Φύλλα στο Φόντο */
        #leaves-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .leaf {
            position: absolute;
            top: -40px;
            font-size: 20px;
            opacity: 0.45;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-40px) rotate(0deg) translateX(0px);
            }
            50% {
                transform: translateY(50vh) rotate(180deg) translateX(25px);
            }
            100% {
                transform: translateY(105vh) rotate(360deg) translateX(-20px);
            }
        }

        /* Κύριο Container */
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-logo {
            font-size: 32px;
            display: inline-block;
            animation: floatCart 3s ease-in-out infinite;
        }

        @keyframes floatCart {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(-4deg); }
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--terracotta);
        }

        .theme-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease;
        }

        /* Εφέ πατήματος σε όλα τα κουμπιά */
        button:active {
            transform: scale(0.93) !important;
        }

        /* Μπάρα Προόδου */
        .progress-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .progress-track {
            width: 100%;
            height: 12px;
            background: var(--sage-light);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--terracotta);
            border-radius: 999px;
            transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .progress-fill.completed {
            background: var(--success);
        }

        /* Εφέ γυαλάδας (Shine) στη μπάρα προόδου */
        .progress-fill::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
            animation: shine 2.2s infinite;
        }

        @keyframes shine {
            100% { left: 160%; }
        }

        .celebration-msg {
            display: none;
            margin-top: 8px;
            text-align: center;
            color: var(--success);
            font-weight: 700;
            font-size: 0.9rem;
            animation: popIn 0.35s ease;
        }

        /* Γρήγορη Προσθήκη (Οριζόντια μπάρα) */
        .quick-add-section {
            margin-bottom: 16px;
        }

        .section-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: block;
        }

        .quick-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: none;
        }

        .quick-chips::-webkit-scrollbar {
            display: none;
        }

        .chip-btn {
            flex: 0 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: background 0.2s, transform 0.1s;
        }

        .chip-btn:hover {
            border-color: var(--terracotta);
        }

        /* Φόρμα Προσθήκης Προϊόντος */
        .add-form {
            background: var(--card-bg);
            padding: 14px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-row {
            display: flex;
            gap: 8px;
        }

        input, select {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 11px 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--terracotta);
        }

        #item-name {
            flex: 1;
        }

        #item-qty {
            width: 72px;
            text-align: center;
        }

        #item-price {
            width: 92px;
            text-align: center;
        }

        #item-category {
            flex: 1;
        }

        .add-btn {
            background: var(--terracotta);
            color: #FFFFFF;
            border: none;
            padding: 11px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .add-btn:hover {
            background: var(--terracotta-dark);
        }

        /* Αναζήτηση & Φίλτρο Απόκρυψης */
        .controls-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        #search-input {
            flex: 1;
            background: var(--card-bg);
        }

        .toggle-hide-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0 12px;
            border-radius: 10px;
