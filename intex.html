  <style>
    :root {
      --bg: #FAF6F0;
      --surface: #FFFFFF;
      --surface-soft: #F3ECE1;
      --text: #2E2925;
      --text-muted: #7A7167;
      --terracotta: #C85A32;
      --terracotta-dark: #A94724;
      --sage: #6B705C;
      --sage-light: #A5A58D;
      --success: #3E8E41;
      --danger: #D62828;
      --border: #E6DDD0;
      --shadow: 0 4px 14px rgba(46, 41, 37, 0.07);
    }

    body.dark {
      --bg: #1C1917;
      --surface: #292524;
      --surface-soft: #35302E;
      --text: #F5F0E8;
      --text-muted: #A8A29E;
      --terracotta: #D96B43;
      --terracotta-dark: #B8522E;
      --sage: #848A72;
      --sage-light: #5C614F;
      --success: #4CAF50;
      --danger: #EF4444;
      --border: #3F3A36;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.3s ease, color 0.3s ease;
      padding-bottom: 135px;
      overflow-x: hidden;
    }

    /* Falling Autumn Leaves */
    #leaves-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .leaf {
      position: absolute;
      top: -40px;
      font-size: 1.25rem;
      opacity: 0.32;
      user-select: none;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(-40px) translateX(0) rotate(0deg);
      }
      50% {
        transform: translateY(50vh) translateX(22px) rotate(180deg);
      }
      100% {
        transform: translateY(105vh) translateX(-18px) rotate(360deg);
      }
    }

    .app-container {
      position: relative;
      z-index: 1;
      max-width: 540px;
      margin: 0 auto;
      padding: 14px 14px 30px;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-float {
      font-size: 2rem;
      display: inline-block;
      animation: floatLogo 3s ease-in-out infinite;
    }

    @keyframes floatLogo {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-5px) rotate(4deg); }
    }

    h1 {
      font-size: 1.3rem;
      margin: 0;
      font-weight: 800;
      color: var(--terracotta);
      letter-spacing: -0.3px;
    }

    .theme-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease;
    }

    /* Button Press Effect */
    button:active {
      transform: scale(0.94);
    }

    /* Progress Section */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .progress-track {
      width: 100%;
      height: 12px;
      background: var(--surface-soft);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--sage), var(--terracotta));
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1), background 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .progress-fill.complete {
      background: var(--success);
    }

    /* Gloss Shine Effect */
    .progress-fill::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
      animation: shine 2.4s infinite;
    }

    @keyframes shine {
      0% { left: -100%; }
      100% { left: 160%; }
    }

    .reward-msg {
      margin-top: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--success);
      text-align: center;
      display: none;
    }

    .reward-msg.show {
      display: block;
      animation: popIn 0.3s ease;
    }

    /* Quick Add Horizontal Bar */
    .quick-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .quick-bar::-webkit-scrollbar { display: none; }

    .quick-chip {
      flex: 0 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      transition: transform 0.1s ease, background 0.2s;
    }

    .quick-chip:hover {
      border-color: var(--terracotta);
    }

    /* Add Product Form */
    .add-form {
      display: grid;
      grid-template-columns: 1fr 78px 86px;
      gap: 8px;
    }

    .add-form input,
    .add-form select {
      width: 100%;
      padding: 10px 11px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
    }

    .add-form input:focus,
    .add-form select:focus {
      border-color: var(--terracotta);
    }

    .cat-row {
      grid-column: 1 / -1;
      display: flex;
      gap: 8px;
    }

    .btn-primary {
      background: var(--terracotta);
      color: #fff;
      border: none;
      border-radius: 11px;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-primary:hover {
      background: var(--terracotta-dark);
    }

    /* Search & Filter Row */
    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .search-box {
      flex: 1;
      padding: 9px 12px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    .toggle-hide-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 11px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .toggle-hide-btn.active {
      background: var(--sage);
      color: #fff;
      border-color: var(--sage);
    }

    /* Category Groups */
    .category-group {
      margin-bottom: 14px;
    }

    .category-title {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--sage);
      margin: 0 0 6px 4px;
      display: flex;
      justify-content: space-between;
    }

    .item-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow);
      animation: slideIn 0.28s ease-out;
      transition: opacity 0.2s ease, background 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .item-card.checked {
      opacity: 0.58;
      background: var(--surface-soft);
    }

    .item-card.checked .item-name {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .check-btn {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: 2px solid var(--terracotta);
      background: transparent;
      color: #fff;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .item-card.checked .check-btn {
      background: var(--sage);
      border-color: var(--sage);
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-name {
      font-weight: 700;
font-size: 0.98rem;
word-break: break-word;

(function () {
const STORAGE_KEY = 'supermarket_list_v1';
const BUDGET_KEY = 'supermarket_budget_v1';
const THEME_KEY = 'supermarket_theme_v1';
let items = [];
let budget = '';
let hideChecked = false;
let searchQuery = '';
let wasOverBudget = false;
// DOM Elements
const leavesContainer = document.getElementById('leaves-container');
const themeToggle = document.getElementById('themeToggle');
const progressText = document.getElementById('progressText');
const progressPercent = document.getElementById('progressPercent');
const progressFill = document.getElementById('progressFill');
const rewardMsg = document.getElementById('rewardMsg');
const quickBar = document.getElementById('quickBar');
const addForm = document.getElementById('addForm');
const itemNameInput = document.getElementById('itemName');
const itemQtyInput = document.getElementById('itemQty');
const itemPriceInput = document.getElementById('itemPrice');
const itemCategorySelect = document.getElementById('itemCategory');
const searchInput = document.getElementById('searchInput');
const hideCheckedBtn = document.getElementById('hideCheckedBtn');
const listContainer = document.getElementById('listContainer');
const deleteCheckedBtn = document.getElementById('deleteCheckedBtn');
const clearAllBtn = document.getElementById('clearAllBtn');
const shareBtn = document.getElementById('shareBtn');
const bottomBar = document.getElementById('bottomBar');
const totalCostEl = document.getElementById('totalCost');
const budgetInput = document.getElementById('budgetInput');
const remainingBadge = document.getElementById('remainingBadge');
function vibrate(ms = 25) {
if (navigator.vibrate) {
navigator.vibrate(ms);
}
}
function formatEuro(num) {
return num.toFixed(2).replace('.', ',') + ' €';
}
// Create subtle falling autumn leaves
function initLeaves() {
const leafIcons = ['🍂', '🍁'];
const count = 11;
for (let i = 0; i < count; i++) {
const span = document.createElement('span');
span.className = 'leaf';
span.textContent = leafIcons[i % leafIcons.length];
span.style.left = Math.random() * 96 + '%';
span.style.animationDuration = (11 + Math.random() * 10) + 's';
span.style.animationDelay = (-Math.random() * 15) + 's';
span.style.fontSize = (0.95 + Math.random() * 0.55) + 'rem';
leavesContainer.appendChild(span);
}
}
// Load state
function loadState() {
try {
const savedItems = localStorage.getItem(STORAGE_KEY);
if (savedItems) items = JSON.parse(savedItems);
const savedBudget = localStorage.getItem(BUDGET_KEY);
if (savedBudget !== null) {
budget = savedBudget;
budgetInput.value = budget;
}
const savedTheme = localStorage.getItem(THEME_KEY);
if (savedTheme === 'dark') {
document.body.classList.add('dark');
themeToggle.textContent = '☀️';
}
} catch (e) {
items = [];
}
}
function saveState() {
localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
localStorage.setItem(BUDGET_KEY, budget);
}
// Add item helper
function addItem(name, qty, price, category) {
const cleanName = name.trim();
if (!cleanName) return;
// If exact same item & category exists unchecked, just increase qty
const existing = items.find(
(i) => !i.checked && i.name.toLowerCase() === cleanName.toLowerCase() && i.category === category
);
if (existing) {
existing.qty += qty;
if (price > 0 && existing.price === 0) existing.price = price;
} else {
items.unshift({
id: Date.now().toString() + Math.random().toString(36).slice(2, 6),
name: cleanName,
qty: Math.max(1, qty),
price: Math.max(0, price),
category: category || '📦 Άλλα',
checked: false
});
}
vibrate(25);
saveState();
render();
}
// Render UI
function render() {
// 1. Progress Calculation
const totalItems = items.length;
const checkedItems = items.filter((i) => i.checked).length;
const pct = totalItems === 0 ? 0 : Math.round((checkedItems / totalItems) * 100);
progressText.textContent = Αγοράστηκαν ${checkedItems} / ${totalItems};
progressPercent.textContent = ${pct}%;
progressFill.style.width = ${pct}%;
if (totalItems > 0 && checkedItems === totalItems) {
progressFill.classList.add('complete');
rewardMsg.classList.add('show');
} else {
progressFill.classList.remove('complete');
rewardMsg.classList.remove('show');
}
// 2. Budget & Total Cost
const totalCost = items.reduce((sum, item) => sum + item.qty * item.price, 0);
totalCostEl.textContent = formatEuro(totalCost);
const budgetNum = parseFloat(budget);
if (!isNaN(budgetNum) && budgetNum > 0) {
const diff = budgetNum - totalCost;
if (diff < 0) {
bottomBar.classList.add('over-budget');
remainingBadge.textContent = Υπέρβαση ${formatEuro(Math.abs(diff))};
if (!wasOverBudget) {
vibrate([40, 40, 40]);
wasOverBudget = true;
}
} else {
bottomBar.classList.remove('over-budget');
remainingBadge.textContent = Υπόλοιπο: ${formatEuro(diff)};
wasOverBudget = false;
}
} else {
bottomBar.classList.remove('over-budget');
remainingBadge.textContent = 'Χωρίς όριο';
wasOverBudget = false;
}
// 3. Filter items
const filtered = items.filter((item) => {
if (hideChecked && item.checked) return false;
if (searchQuery && !item.name.toLowerCase().includes(searchQuery.toLowerCase())) return false;
return true;
});
listContainer.innerHTML = '';
if (filtered.length === 0) {
listContainer.innerHTML = <div class="empty-state"> ${items.length === 0 ? '🍂 Η λίστα σου είναι άδεια. Πρόσθεσε προϊόντα παραπάνω!' : '🔎 Δεν βρέθηκαν προϊόντα με αυτά τα κριτήρια.'} </div>;
return;
}
// 4. Group by Category
const groups = {};
filtered.forEach((item) => {
if (!groups[item.category]) groups[item.category] = [];
groups[item.category].push(item);
});
Object.keys(groups).forEach((cat) => {
const groupDiv = document.createElement('div');
groupDiv.className = 'category-group';
const catSum = groups[cat].reduce((s, i) => s + i.qty * i.price, 0);
const titleDiv = document.createElement('div');
titleDiv.className = 'category-title';
titleDiv.innerHTML = <span>${cat}</span><span>${catSum > 0 ? formatEuro(catSum) : ''}</span>;
groupDiv.appendChild(titleDiv);
groups[cat].forEach((item) => {
const row = document.createElement('div');
row.className = 'item-card' + (item.checked ? ' checked' : '');
const subtotal = item.qty * item.price;
row.innerHTML = <button class="check-btn" aria-label="Επιλογή">${item.checked ? '✓' : ''}</button> <div class="item-info"> <div class="item-name">${escapeHtml(item.name)}</div> <div class="item-sub">${item.qty} τεμ. ${item.price > 0 ?× ${formatEuro(item.price)} = ${formatEuro(subtotal)}: ''}</div> </div> <div class="item-controls"> <div class="qty-box"> <button class="qty-btn minus" aria-label="Μείωση">−</button> <span class="qty-val">${item.qty}</span> <button class="qty-btn plus" aria-label="Αύξηση">+</button> </div> <div class="price-input-wrap" title="Τιμή μονάδας (€)"> <input type="number" class="inline-price" value="${item.price > 0 ? item.price : ''}" placeholder="0.00" min="0" step="0.01" /> <span>€</span> </div> <button class="del-btn" aria-label="Διαγραφή">✕</button> </div>;
// Check toggle
row.querySelector('.check-btn').addEventListener('click', () => {
item.checked = !item.checked;
vibrate(item.checked ? 30 : 15);
saveState();
render();
});
// Quantity -
row.querySelector('.minus').addEventListener('click', () => {
if (item.qty > 1) {
item.qty -= 1;
vibrate(15);
saveState();
render();
}
});
// Quantity +
row.querySelector('.plus').addEventListener('click', () => {
item.qty += 1;
vibrate(15);
saveState();
render();
});
// Inline price edit
const priceInput = row.querySelector('.inline-price');
priceInput.addEventListener('change', (e) => {
const val = parseFloat(e.target.value);
item.price = isNaN(val) || val < 0 ? 0 : val;
saveState();
render();
});
// Delete item
row.querySelector('.del-btn').addEventListener('click', () => {
items = items.filter((i) => i.id !== item.id);
vibrate(20);
saveState();
render();
});
groupDiv.appendChild(row);
});
listContainer.appendChild(groupDiv);
});
}
function escapeHtml(str) {
const div = document.createElement('div');
div.textContent = str;
return div.innerHTML;
}
// Event Listeners
themeToggle.addEventListener('click', () => {
document.body.classList.toggle('dark');
const isDark = document.body.classList.contains('dark');
themeToggle.textContent = isDark ? '☀️' : '🌙';
localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
vibrate(15);
});
quickBar.addEventListener('click', (e) => {
const btn = e.target.closest('.quick-chip');
if (!btn) return;
addItem(
btn.dataset.name,
1,
parseFloat(btn.dataset.price) || 0,
btn.dataset.cat
);
});
addForm.addEventListener('submit', (e) => {
e.preventDefault();
const name = itemNameInput.value;
const qty = parseInt(itemQtyInput.value, 10) || 1;
const price = parseFloat(itemPriceInput.value) || 0;
const cat = itemCategorySelect.value;
addItem(name, qty, price, cat);
itemNameInput.value = '';
itemQtyInput.value = '1';
itemPriceInput.value = '';
itemNameInput.focus();
});
searchInput.addEventListener('input', (e) => {
searchQuery = e.target.value;
render();
});
hideCheckedBtn.addEventListener('click', () => {
hideChecked = !hideChecked;
hideCheckedBtn.classList.toggle('active', hideChecked);
hideCheckedBtn.textContent = hideChecked ? '👁️ Εμφάνιση όλων' : '👁️ Απόκρυψη αγορασμένων';
vibrate(15);
render();
});
budgetInput.addEventListener('input', (e) => {
budget = e.target.value;
saveState();
render();
});
deleteCheckedBtn.addEventListener('click', () => {
const hasChecked = items.some((i) => i.checked);
if (!hasChecked) return;
items = items.filter((i) => !i.checked);
vibrate(30);
saveState();
render();
});
clearAllBtn.addEventListener('click', () => {
if (items.length === 0) return;
if (confirm('Θέλεις σίγουρα να καθαρίσεις όλη τη λίστα;')) {
items = [];
vibrate([30, 30]);
saveState();
render();
}
});
shareBtn.addEventListener('click', async () => {
if (items.length === 0) {
alert('Η λίστα είναι άδεια!');
return;
}
let text = '🛒 Λίστα Σούπερ Μάρκετ\n\n';
const groups = {};
items.forEach((i) => {
if (!groups[i.category]) groups[i.category] = [];
groups[i.category].push(i);
});
Object.keys(groups).forEach((cat) => {
text += ${cat}\n;
groups[cat].forEach((i) => {
const mark = i.checked ? '✅' : '⬜';
const priceStr = i.price > 0 ?  (${formatEuro(i.qty * i.price)}) : '';
text += ${mark} ${i.name} x${i.qty}${priceStr}\n;
});
text += '\n';
});
const total = items.reduce((s, i) => s + i.qty * i.price, 0);
if (total > 0) {
text += 💰 *Σύνολο: ${formatEuro(total)}*;
}
vibrate(20);
if (navigator.share) {
try {
await navigator.share({ title: 'Λίστα Σούπερ Μάρκετ', text });
return;
} catch (err) {
// Fallback to clipboard if cancelled/unsupported
}
}
try {
await navigator.clipboard.writeText(text);
alert('Η λίστα αντιγράφηκε! Επικόλλησέ τη στο Viber ή στο WhatsApp.');
} catch (err) {
alert(text);
}
});
// Init
initLeaves();
loadState();
render();
})();
